services:
  noetic:
    devices:
      - ${VIDEO_DEVICE:-/dev/video4}:${VIDEO_DEVICE:-/dev/video4}
    volumes:
      - /dev/v4l:/dev/v4l:ro
      - ${WORKSPACE_DIR:-/home/j1angjj/workspace/maxhub-a3/workspace/ubuntu}:/home/${NOETIC_USER:-developer}/maxhub-a3/workspace/ubuntu
    group_add:
      - video
      - dialout
    environment:
      VIDEO_DEVICE: ${VIDEO_DEVICE:-/dev/video4}
